plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silentseas.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.silentseas.game'
        minSdk 24
        targetSdk 36
        versionCode 62405
        versionName '6.24.5'
        // Supertonic inference is intended for modern 64-bit Android devices.
        // Keeping only arm64 avoids shipping unused ONNX Runtime native binaries.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
}
