plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silentseas.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.silentseas.game'
        minSdk 24
        targetSdk 36
        versionCode 62505
        versionName '6.25.5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The repository may still contain the legacy offline-TTS source tree
    // (com/silentseas/game/voice/SupertonicEngine.java). The current updater
    // shell does not use it, and its ONNX Runtime dependency/assets are not
    // part of this lightweight build. Exclude that stale source so an old
    // repository checkout cannot break the APK build.
    sourceSets {
        main {
            java {
                exclude 'com/silentseas/game/voice/**'
            }
        }
    }
}
