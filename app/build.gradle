plugins {
    id 'com.android.application'
}

android {
    namespace 'com.silentseas.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.silentseas.game'
        minSdk 24
        targetSdk 36
        versionCode 62505
        versionName '6.25.5'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
