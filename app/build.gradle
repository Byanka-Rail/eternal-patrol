plugins {
    id 'com.android.application'
}

/* 앱 버전은 게임 파일(ETERNAL_PATROL.html)의 window.EP_BUILD 를 그대로 따른다.
   6.43.1 → versionName '6.43.1', versionCode 64301. 게임을 올릴 때마다 손으로 맞출 필요가 없다. */
def gameVersion = {
    def f = rootProject.file('ETERNAL_PATROL.html')
    def m = (f.getText('UTF-8') =~ /window\.EP_BUILD='([0-9]+(?:\.[0-9]+)*)'/)
    return m.find() ? m.group(1) : '0.0.0'
}()
def gameVersionCode = {
    def p = (gameVersion.tokenize('.').collect { it as int } + [0, 0, 0])
    return p[0] * 10000 + p[1] * 100 + p[2]
}()

android {
    namespace 'com.silentseas.game'
    compileSdk 36

    defaultConfig {
        applicationId 'com.silentseas.game'
        minSdk 24
        targetSdk 36
        versionCode gameVersionCode
        versionName gameVersion
        buildConfigField 'String', 'GAME_VERSION', '"' + gameVersion + '"'
        // Supertonic inference is intended for modern 64-bit Android devices.
        // Keeping only arm64 avoids shipping unused ONNX Runtime native binaries.
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    /* 빌드마다 새 디버그 키가 만들어지면 새 APK 를 옛 앱 위에 설치할 수 없다(서명 불일치).
       저장소에 고정 디버그 키를 두고 늘 그것으로 서명한다 — 이 키로 만든 APK 부터는 덮어 설치된다. */
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    buildTypes {
        debug { signingConfig signingConfigs.debug }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.29.0'
}
