name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-build.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Bundle ONNX Runtime license notices
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/assets/licenses
          BASE="https://raw.githubusercontent.com/microsoft/onnxruntime/v1.29.0"
          curl -L --fail --retry 5 "$BASE/LICENSE" -o app/src/main/assets/licenses/LICENSE_ONNXRUNTIME_MIT.txt
          curl -L --fail --retry 5 "$BASE/ThirdPartyNotices.txt" -o app/src/main/assets/licenses/ONNXRUNTIME_ThirdPartyNotices.txt
          grep -q "MIT License" app/src/main/assets/licenses/LICENSE_ONNXRUNTIME_MIT.txt
          grep -q "THIRD PARTY SOFTWARE NOTICES" app/src/main/assets/licenses/ONNXRUNTIME_ThirdPartyNotices.txt
          test $(wc -c < app/src/main/assets/licenses/ONNXRUNTIME_ThirdPartyNotices.txt) -gt 10000
      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: ETERNAL_PATROL_v6.24.8_FP32_MOOD_LICENSE_debug_apk
          path: app/build/outputs/apk/debug/app-debug.apk
