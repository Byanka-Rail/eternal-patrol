name: Publish Official Supertonic Voice Pack

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install validation tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install "onnx==1.17.0" "onnxruntime==1.20.1"

      - name: Download official Supertonic 3 FP32 and build ETERNAL PATROL CPU pack
        shell: bash
        env:
          OFFICIAL_REVISION: 724fb5abbf5502583fb520898d45929e62f02c0b
          RELEASE_TAG: voicepack-v3
          PACK_ID: supertonic3_fp32_ep_v3
          ZIP_NAME: ETERNAL_PATROL_SUPERTONIC3_FP32_V3.zip
          MANIFEST_NAME: ETERNAL_PATROL_SUPERTONIC3_FP32_V3.json
          SHA_NAME: ETERNAL_PATROL_SUPERTONIC3_FP32_V3_SHA256.txt
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/ep_voicepack_v3"
          OUT="$RUNNER_TEMP/ep_voicepack_v3_out"
          mkdir -p "$ROOT/onnx" "$ROOT/voice_styles" "$OUT"

          BASE="https://huggingface.co/Supertone/supertonic-3/resolve/${OFFICIAL_REVISION}"
          fetch() {
            echo "Official download: $1"
            curl -L --fail --retry 5 --retry-all-errors --connect-timeout 30 --max-time 2400 \
              -A "ETERNAL-PATROL-VoicePack-Builder/3.0" \
              "${BASE}/$1?download=true" -o "$2"
          }

          # Official FP32 model assets. No model conversion is performed.
          fetch "onnx/duration_predictor.onnx" "$ROOT/onnx/duration_predictor.onnx"
          fetch "onnx/text_encoder.onnx" "$ROOT/onnx/text_encoder.onnx"
          fetch "onnx/vector_estimator.onnx" "$ROOT/onnx/vector_estimator.onnx"
          fetch "onnx/vocoder.onnx" "$ROOT/onnx/vocoder.onnx"
          fetch "onnx/tts.json" "$ROOT/onnx/tts.json"
          fetch "onnx/unicode_indexer.json" "$ROOT/onnx/unicode_indexer.json"
          for v in M1 M2 M3 M4 M5; do
            fetch "voice_styles/${v}.json" "$ROOT/voice_styles/${v}.json"
          done
          fetch "LICENSE" "$ROOT/LICENSE"

          # Validate the exact files that Android will download.
          python3 - <<'PY'
          import os
          from pathlib import Path
          import onnx
          import onnxruntime as ort

          root = Path(os.environ['RUNNER_TEMP']) / 'ep_voicepack_v3' / 'onnx'
          names = ['duration_predictor.onnx','text_encoder.onnx','vector_estimator.onnx','vocoder.onnx']
          for name in names:
              p = root / name
              print('FP32 ONNX checker:', name)
              onnx.checker.check_model(str(p))
              print('CPUExecutionProvider load:', name)
              sess = ort.InferenceSession(str(p), providers=['CPUExecutionProvider'])
              print('  inputs=', [(x.name, x.type) for x in sess.get_inputs()])
              print('  outputs=', [(x.name, x.type) for x in sess.get_outputs()])
              del sess
          PY

          cat > "$ROOT/CONVERSION_NOTES.txt" <<EOF
          ETERNAL PATROL Supertonic 3 FP32 CPU pack notes
          =================================================
          Original model: Supertone/supertonic-3
          Official pinned revision: ${OFFICIAL_REVISION}
          Runtime distribution host: Byanka-Rail/eternal-patrol GitHub Release
          Variant: FP32 ONNX

          No weight conversion, quantization, training, or fine-tuning is performed.
          The official FP32 ONNX files are mirrored byte-for-byte from the pinned
          Supertone model revision after ONNX checker and CPUExecutionProvider load
          validation. This v3 pack replaces the v2 FP16 pack because Android
          CPUExecutionProvider does not provide float16 kernels for all operators.
          EOF

          cat > "$ROOT/THIRD_PARTY_NOTICES.txt" <<EOF
          ETERNAL PATROL optional crew voice pack v3 — third-party notices
          =================================================================

          Runtime distribution host:
            Byanka-Rail/eternal-patrol GitHub Release, tag voicepack-v3

          Original model:
            Supertonic 3 by Supertone Inc.
            Source: https://huggingface.co/Supertone/supertonic-3
            Pinned official revision: ${OFFICIAL_REVISION}
            Model license: BigScience OpenRAIL-M

          ETERNAL PATROL distribution:
            The official FP32 ONNX assets are mirrored without model-weight
            conversion for Android CPU inference. The included LICENSE is copied
            from the pinned official model revision. AI-generated crew speech is
            disclosed as synthetic in the game UI.
          EOF

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'ep_voicepack_v3'
          info = {
              'schema': 3,
              'pack': os.environ['PACK_ID'],
              'variant': 'FP32',
              'originalModel': 'Supertone/supertonic-3',
              'officialRevision': os.environ['OFFICIAL_REVISION'],
              'convertedBy': 'NONE — official FP32 mirrored by ETERNAL PATROL GitHub Actions',
              'modelWeightsModified': False,
              'voices': ['M1','M2','M3','M4','M5'],
              'runtimeHost': 'Byanka-Rail/eternal-patrol GitHub Release',
              'cpuCompatibilityReason': 'FP32 retained for ONNX Runtime Android CPUExecutionProvider'
          }
          (root/'PACK_INFO.json').write_text(json.dumps(info, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

          python3 - <<'PY'
          import hashlib, json, os, zipfile
          from pathlib import Path
          root = Path(os.environ['RUNNER_TEMP']) / 'ep_voicepack_v3'
          out = Path(os.environ['RUNNER_TEMP']) / 'ep_voicepack_v3_out'
          zpath = out / os.environ['ZIP_NAME']
          with zipfile.ZipFile(zpath, 'w', compression=zipfile.ZIP_STORED, allowZip64=True) as z:
              for p in sorted(root.rglob('*')):
                  if p.is_file():
                      z.write(p, p.relative_to(root).as_posix())
          h = hashlib.sha256()
          with zpath.open('rb') as f:
              for chunk in iter(lambda: f.read(1024*1024), b''):
                  h.update(chunk)
          digest = h.hexdigest()
          size = zpath.stat().st_size
          if not (330 * 1024 * 1024 <= size <= 460 * 1024 * 1024):
              raise SystemExit(f'Unexpected FP32 pack size: {size}')
          url = f"https://github.com/Byanka-Rail/eternal-patrol/releases/download/{os.environ['RELEASE_TAG']}/{os.environ['ZIP_NAME']}"
          manifest = {
              'schema': 3,
              'pack': os.environ['PACK_ID'],
              'variant': 'FP32',
              'bytes': size,
              'sha256': digest,
              'url': url,
              'runtimeHost': 'Byanka-Rail/eternal-patrol GitHub Release',
              'originalModel': 'Supertone/supertonic-3',
              'officialRevision': os.environ['OFFICIAL_REVISION'],
              'modelWeightsModified': False
          }
          (out/os.environ['MANIFEST_NAME']).write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          (out/os.environ['SHA_NAME']).write_text(f"{digest}  {os.environ['ZIP_NAME']}\n", encoding='utf-8')
          print(f'Voice pack: {size} bytes ({size/1024/1024:.1f} MiB)')
          print(f'SHA-256: {digest}')
          PY

          ls -lh "$OUT"

      - name: Publish ETERNAL PATROL voice-pack v3 release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: voicepack-v3
          ZIP_NAME: ETERNAL_PATROL_SUPERTONIC3_FP32_V3.zip
          MANIFEST_NAME: ETERNAL_PATROL_SUPERTONIC3_FP32_V3.json
          SHA_NAME: ETERNAL_PATROL_SUPERTONIC3_FP32_V3_SHA256.txt
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/ep_voicepack_v3_out"
          NOTES="Optional Supertonic 3 FP32 crew voice pack v3. Mirrored from the pinned official Supertone/supertonic-3 FP32 ONNX assets after ONNX and CPUExecutionProvider validation. No model-weight conversion is performed. Original OpenRAIL-M license and provenance are included."
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" \
              "$OUT/$ZIP_NAME" "$OUT/$MANIFEST_NAME" "$OUT/$SHA_NAME" --clobber
          else
            gh release create "$RELEASE_TAG" \
              "$OUT/$ZIP_NAME" "$OUT/$MANIFEST_NAME" "$OUT/$SHA_NAME" \
              --title "ETERNAL PATROL optional crew voice pack v3 FP32 CPU" \
              --notes "$NOTES"
          fi
